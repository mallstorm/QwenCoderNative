name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-release.apk | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: QwenCoderNative-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk QwenCoderNative.apk
          gh release create "build-${{ github.run_number }}" QwenCoderNative.apk --title "QwenCoderNative build ${{ github.run_number }}" --notes "Signed release APK (constant signing key, installs over previous builds), commit ${{ github.sha }}"
